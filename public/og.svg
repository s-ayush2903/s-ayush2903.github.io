<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=block');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a1a"/>

  <!-- Green accent bar, bottom-left -->
  <rect x="80" y="574" width="160" height="3" rx="1.5" fill="#4ade80"/>

  <!-- Favicon mark — original geometry scaled 2× via transform, centred vertically -->
  <!-- Original 80×80 → 160×160, top-left placed at (80, 235) so centre at (160, 315) -->
  <g transform="translate(80, 235) scale(2)">
    <circle cx="40" cy="40" r="22" fill="none" stroke="#e5e5e5" stroke-width="3"/>
    <circle cx="40" cy="18" r="5" fill="#e5e5e5"/>
    <circle cx="59.1" cy="51" r="5" fill="#e5e5e5"/>
    <circle cx="20.9" cy="51" r="5" fill="#4ade80"/>
  </g>

  <!-- Divider -->
  <line x1="300" y1="240" x2="300" y2="390" stroke="#333333" stroke-width="1"/>

  <!-- Main heading -->
  <text x="336" y="300"
    font-family="'JetBrains Mono', ui-monospace, 'Courier New', monospace"
    font-size="52" font-weight="700" fill="#f5f5f5" letter-spacing="-0.5">systems &amp; writing</text>

  <!-- Name -->
  <text x="338" y="348"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="26" fill="#a3a3a3">Ayush Shrivastava</text>

  <!-- URL -->
  <text x="338" y="392"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="18" fill="#525252">s-ayush2903.github.io</text>
</svg>
